   <input id="busca" type="text" placeholder="Digite a placa">

<button onclick="buscar()" id="buscar">
  <img id="lupa" src="search2.png">
  </button>
<button onclick="copiar()" id="copiar">
  <img id="check" src="floppy-disk.png">
  <b id="text_salvar">Salvar</b></button>

<script>
function buscar() {
 
    var texto = document.getElementById("busca").value.toLowerCase();

    var retangulos = document.querySelectorAll(".retangulo");
    for (var i = 0; i < retangulos.length; i++) {

      
      var inputs = retangulos[i].querySelectorAll("input");

      for (var j = 0; j < inputs.length; j++) {
        

        if (inputs[j].value.toLowerCase().includes(texto)) {

          retangulos[i].scrollIntoView({ behavior: "smooth" });

          return; // para depois de achar o primeiro
        }
      }
    }

    alert("Placa não encontrada!");
  }
;

function gerarPDF() {
  html2pdf().from(document.getElementById("retangulo"))
  .save("recibo-jp-motos.pdf");
}

</script>
